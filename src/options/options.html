<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NerdTip — Custom terms</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    body { background: var(--surface); }
    .page { max-width: 680px; margin: 0 auto; padding: 40px 20px 64px; display: grid; gap: 20px; }

    .page-header { display: flex; align-items: center; gap: 14px; }
    .page-header h1 { font-size: 22px; font-weight: 650; line-height: 1.2; }

    .card { background: var(--bg); }
    .form { display: grid; gap: 14px; padding: 20px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 13px; font-weight: 600; }
    textarea.input { min-height: 88px; resize: vertical; }
    .form-actions { display: flex; justify-content: flex-end; }

    .list-header { display: flex; align-items: baseline; justify-content: space-between; margin-top: 8px; }

    .empty {
      padding: 28px 20px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      text-align: center;
    }

    .terms { list-style: none; margin: 0; padding: 0; overflow: hidden; }
    .terms:empty { display: none; }
    .terms li { display: flex; align-items: flex-start; gap: 16px; padding: 14px 16px; }
    .terms li + li { border-top: 1px solid var(--border); }
    .term-body { display: grid; gap: 2px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .term-def { color: var(--muted); }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <img src="../../icons/icon-48.png" width="44" height="44" alt="">
      <div>
        <h1>Custom terms</h1>
        <p class="muted">Highlighted on every enabled site. They override built-in definitions.</p>
      </div>
    </header>

    <form id="add-form" class="card form">
      <div class="field">
        <label for="term">Term</label>
        <input id="term" class="input" required maxlength="60" autocomplete="off" placeholder="e.g. Kubernetes">
      </div>
      <div class="field">
        <label for="definition">Definition</label>
        <textarea id="definition" class="input" required maxlength="500" placeholder="A short, one or two sentence explanation"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add term</button>
      </div>
    </form>

    <div class="list-header">
      <h2 class="section-title">Your terms</h2>
    </div>
    <p class="empty muted" id="empty">No custom terms yet. Add one above.</p>
    <ul class="card terms" id="terms"></ul>
  </main>

  <script src="../../vendor/browser-polyfill.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
