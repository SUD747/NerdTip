<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NerdTip</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    body { width: 300px; padding: 14px; display: grid; gap: 12px; }

    .header { display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: 15px; font-weight: 650; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      cursor: pointer;
    }
    .row + .row { border-top: 1px solid var(--border); }
    .row-text { display: grid; min-width: 0; }
    .row-sub {
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .unsupported { padding: 10px 12px; font-size: 13px; }
    .section-title { margin: 2px 2px -4px; }
    .footer .btn { width: 100%; }
  </style>
</head>
<body>
  <header class="header">
    <img src="../../icons/icon-32.png" width="26" height="26" alt="">
    <h1>NerdTip</h1>
  </header>

  <section class="card">
    <label class="row">
      <span class="row-text">
        <span>Enabled on this site</span>
        <span class="row-sub" id="site"></span>
      </span>
      <input type="checkbox" class="switch" role="switch" id="site-enabled">
    </label>
    <p class="unsupported muted" id="unsupported" hidden>NerdTip can't run on this page.</p>
  </section>

  <h2 class="section-title">Glossaries</h2>
  <section class="card" id="domains"></section>

  <footer class="footer">
    <button type="button" class="btn" id="open-options">Manage custom terms</button>
  </footer>

  <script src="../../vendor/browser-polyfill.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
